name: ci

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-amd64:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/api:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/api:buildcache-amd64,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/api:latest-amd64
            ghcr.io/${{ env.OWNER_LC }}/api:${{ github.sha }}-amd64
  build-arm64:
    needs: tests
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/api:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/api:buildcache-arm64,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/api:latest-arm64
            ghcr.io/${{ env.OWNER_LC }}/api:${{ github.sha }}-arm64
  merge:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        run: |
          docker buildx imagetools create -t "ghcr.io/${OWNER_LC}/api:latest" \
            "ghcr.io/${OWNER_LC}/api:latest-amd64" \
            "ghcr.io/${OWNER_LC}/api:latest-arm64"
          docker buildx imagetools create -t "ghcr.io/${OWNER_LC}/api:${GITHUB_SHA}" \
            "ghcr.io/${OWNER_LC}/api:${GITHUB_SHA}-amd64" \
            "ghcr.io/${OWNER_LC}/api:${GITHUB_SHA}-arm64"
      - name: Delete Package Versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: api
          package-type: container
          min-versions-to-keep: 9
          ignore-versions: '^buildcache-*'
