table:
  name: club_members
  schema: public
object_relationships:
- name: club
  using:
    foreign_key_constraint_on: club_id
- name: player
  using:
    foreign_key_constraint_on: steam_id
insert_permissions:
- role: user
  permission:
    check:
      _or:
      - club:
          join_mode:
            _eq: open
      - club:
          owner_steam_id:
            _eq: X-Hasura-User-Id
      - club:
          members:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - _or:
              - role:
                  _in:
                  - owner
                  - co_owner
                  - admin
              - level:
                  _gte: 8
    set:
      steam_id: x-hasura-user-id
    columns:
    - club_id
    - role
    - level
    - is_primary
select_permissions:
- role: guest
  permission:
    columns:
    - club_id
    - steam_id
    - role
    - level
    - xp
    - title
    - staff_level
    - club_vip_until
    - is_primary
    - is_vip
    - joined_at
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns:
    - is_primary
    filter:
      _or:
      - steam_id:
          _eq: X-Hasura-User-Id
      - club:
          members:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - _or:
              - role:
                  _in:
                  - owner
                  - co_owner
                  - admin
              - level:
                  _gte: 8
    check: {}
delete_permissions:
- role: user
  permission:
    filter:
      _or:
      - steam_id:
          _eq: X-Hasura-User-Id
      - club:
          members:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - _or:
              - role:
                  _in:
                  - owner
                  - co_owner
                  - admin
              - level:
                  _gte: 8
