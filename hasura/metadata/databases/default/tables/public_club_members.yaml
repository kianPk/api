table:
  name: club_members
  schema: public
object_relationships:
- name: club
  using:
    foreign_key_constraint_on: club_id
- name: player
  using:
    foreign_key_constraint_on: steam_id
insert_permissions:
- role: user
  permission:
    check:
      _or:
      - club:
          join_mode:
            _eq: open
      - club:
          owner_steam_id:
            _eq: X-Hasura-User-Id
      - club:
          members:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - role:
                _in:
                - owner
                - admin
    set:
      steam_id: x-hasura-user-id
    columns:
    - club_id
    - role
    - is_primary
select_permissions:
- role: guest
  permission:
    columns:
    - club_id
    - steam_id
    - role
    - is_primary
    - joined_at
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns:
    - role
    - is_primary
    filter:
      _or:
      - steam_id:
          _eq: X-Hasura-User-Id
      - club:
          members:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - role:
                _in:
                - owner
                - admin
    check: {}
delete_permissions:
- role: user
  permission:
    filter:
      _or:
      - steam_id:
          _eq: X-Hasura-User-Id
      - club:
          members:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - role:
                _in:
                - owner
                - admin
