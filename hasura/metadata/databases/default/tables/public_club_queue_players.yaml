table:
  name: club_queue_players
  schema: public
object_relationships:
- name: queue
  using:
    foreign_key_constraint_on: queue_id
- name: player
  using:
    foreign_key_constraint_on: steam_id
insert_permissions:
- role: user
  permission:
    check: {}
    set:
      steam_id: x-hasura-user-id
    columns:
    - queue_id
select_permissions:
- role: user
  permission:
    columns:
    - queue_id
    - steam_id
    - joined_at
    filter: {}
delete_permissions:
- role: user
  permission:
    filter:
      steam_id:
        _eq: X-Hasura-User-Id
