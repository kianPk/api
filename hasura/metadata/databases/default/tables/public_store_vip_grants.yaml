table:
  name: store_vip_grants
  schema: public
object_relationships:
  - name: player
    using:
      foreign_key_constraint_on: steam_id
  - name: server
    using:
      foreign_key_constraint_on: server_id
  - name: order
    using:
      foreign_key_constraint_on: order_id
select_permissions:
  - role: administrator
    permission:
      columns:
        - id
        - steam_id
        - server_id
        - order_id
        - expires_at
        - granted_at
        - updated_at
      filter: {}
      allow_aggregations: true
  - role: guest
    permission:
      columns:
        - id
        - steam_id
        - server_id
        - expires_at
        - granted_at
      filter: {}
