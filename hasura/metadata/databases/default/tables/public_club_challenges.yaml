table:
  name: club_challenges
  schema: public
object_relationships:
- name: club
  using:
    foreign_key_constraint_on: club_id
- name: catalog
  using:
    foreign_key_constraint_on: catalog_id
- name: created_by
  using:
    foreign_key_constraint_on: created_by_steam_id
computed_fields:
- name: is_visible
  definition:
    function:
      name: club_challenge_is_visible
      schema: public
    session_argument: hasura_session
array_relationships:
- name: progress
  using:
    foreign_key_constraint_on:
      column: challenge_id
      table:
        name: club_challenge_progress
        schema: public
- name: targets
  using:
    foreign_key_constraint_on:
      column: challenge_id
      table:
        name: club_challenge_targets
        schema: public
insert_permissions:
- role: user
  permission:
    check:
      club:
        owner_steam_id:
          _eq: X-Hasura-User-Id
    set:
      created_by_steam_id: x-hasura-user-id
    columns:
    - club_id
    - catalog_id
    - ends_at
    - prize_ypoints
    - prize_other
    - prize_scope
    - audience
- role: administrator
  permission:
    check: {}
    set:
      created_by_steam_id: x-hasura-user-id
    columns:
    - club_id
    - catalog_id
    - ends_at
    - prize_ypoints
    - prize_other
    - prize_scope
    - audience
    - active
select_permissions:
- role: guest
  permission:
    columns: &id001
    - id
    - club_id
    - catalog_id
    - created_by_steam_id
    - ends_at
    - prize_ypoints
    - prize_other
    - prize_scope
    - audience
    - active
    - created_at
    filter:
      is_visible:
        _eq: true
    allow_aggregations: true
    computed_fields:
    - is_visible
- role: administrator
  permission:
    columns: *id001
    filter: {}
    allow_aggregations: true
    computed_fields:
    - is_visible
update_permissions:
- role: user
  permission:
    columns:
    - ends_at
    - prize_ypoints
    - prize_other
    - prize_scope
    - audience
    - active
    filter:
      club:
        owner_steam_id:
          _eq: X-Hasura-User-Id
    check: {}
- role: administrator
  permission:
    columns:
    - ends_at
    - prize_ypoints
    - prize_other
    - prize_scope
    - audience
    - active
    filter: {}
    check: {}
delete_permissions:
- role: user
  permission:
    filter:
      club:
        owner_steam_id:
          _eq: X-Hasura-User-Id
- role: administrator
  permission:
    filter: {}
