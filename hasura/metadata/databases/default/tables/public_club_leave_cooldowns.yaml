table:
  name: club_leave_cooldowns
  schema: public
object_relationships:
- name: player
  using:
    foreign_key_constraint_on: steam_id
select_permissions:
- role: user
  permission:
    columns:
    - steam_id
    - leave_count
    - last_left_at
    - blocked_until
    filter:
      steam_id:
        _eq: X-Hasura-User-Id
- role: administrator
  permission:
    columns:
    - steam_id
    - leave_count
    - last_left_at
    - blocked_until
    filter: {}
