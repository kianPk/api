table:
  name: club_invites
  schema: public
object_relationships:
  - name: club
    using:
      foreign_key_constraint_on: club_id
  - name: player
    using:
      foreign_key_constraint_on: steam_id
  - name: invited_by
    using:
      foreign_key_constraint_on: invited_by_steam_id
insert_permissions:
  - role: user
    permission:
      check:
        club:
          members:
            _and:
              - steam_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - admin
      set:
        invited_by_steam_id: x-hasura-user-id
      columns:
        - club_id
        - steam_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - club_id
        - steam_id
        - invited_by_steam_id
        - created_at
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - club:
              members:
                _and:
                  - steam_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - admin
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - invited_by_steam_id:
              _eq: X-Hasura-User-Id
          - club:
              members:
                _and:
                  - steam_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - admin
