table:
  name: store_products
  schema: public
object_relationships:
  - name: vip_server
    using:
      foreign_key_constraint_on: vip_server_id
insert_permissions:
  - role: administrator
    permission:
      check: {}
      columns:
        - title
        - slug
        - description
        - price_irr
        - image_url
        - active
        - sort_order
        - ypoint_amount
        - vip_server_id
        - vip_duration
        - subscription_tier
select_permissions:
  - role: administrator
    permission:
      columns:
        - id
        - title
        - slug
        - description
        - price_irr
        - image_url
        - active
        - sort_order
        - ypoint_amount
        - vip_server_id
        - vip_duration
        - subscription_tier
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
  - role: guest
    permission:
      columns:
        - id
        - title
        - slug
        - description
        - price_irr
        - image_url
        - active
        - sort_order
        - ypoint_amount
        - vip_duration
        - subscription_tier
        - created_at
      filter:
        active:
          _eq: true
update_permissions:
  - role: administrator
    permission:
      columns:
        - title
        - slug
        - description
        - price_irr
        - image_url
        - active
        - sort_order
        - ypoint_amount
        - vip_server_id
        - vip_duration
        - subscription_tier
        - updated_at
      filter: {}
      check: {}
delete_permissions:
  - role: administrator
    permission:
      filter: {}
