table:
  name: club_activity
  schema: public
object_relationships:
- name: club
  using:
    foreign_key_constraint_on: club_id
- name: actor
  using:
    foreign_key_constraint_on: actor_steam_id
select_permissions:
- role: guest
  permission:
    columns:
    - id
    - club_id
    - actor_steam_id
    - kind
    - payload
    - created_at
    filter: {}
insert_permissions:
- role: user
  permission:
    check:
      club:
        members:
          steam_id:
            _eq: X-Hasura-User-Id
    set:
      actor_steam_id: x-hasura-user-id
    columns:
    - club_id
    - kind
    - payload
