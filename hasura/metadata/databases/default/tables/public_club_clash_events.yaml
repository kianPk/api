table:
  name: club_clash_events
  schema: public
array_relationships:
- name: entries
  using:
    foreign_key_constraint_on:
      column: event_id
      table:
        name: club_clash_entries
        schema: public
select_permissions:
- role: guest
  permission:
    columns:
    - id
    - name
    - starts_at
    - ends_at
    - locked
    - created_at
    filter: {}
insert_permissions:
- role: administrator
  permission:
    check: {}
    columns:
    - name
    - starts_at
    - ends_at
    - locked
