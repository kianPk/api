table:
  name: ypoint_ledger
  schema: public
object_relationships:
  - name: player
    using:
      foreign_key_constraint_on: steam_id
select_permissions:
  - role: administrator
    permission:
      columns:
        - id
        - steam_id
        - delta
        - balance_after
        - reason
        - ref_type
        - ref_id
        - created_at
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - id
        - steam_id
        - delta
        - balance_after
        - reason
        - ref_type
        - ref_id
        - created_at
      filter:
        steam_id:
          _eq: X-Hasura-User-Id
# Writes go through Nest / Postgres service role.
