table:
  name: club_messages
  schema: public
object_relationships:
- name: channel
  using:
    foreign_key_constraint_on: channel_id
- name: club
  using:
    foreign_key_constraint_on: club_id
- name: author
  using:
    foreign_key_constraint_on: author_steam_id
insert_permissions:
- role: user
  permission:
    check:
      _or:
      - club:
          members:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - _or:
              - level:
                  _gte: 8
              - role:
                  _in:
                  - owner
                  - co_owner
                  - admin
      - _exists:
          _table:
            name: club_member_perm_overrides
            schema: public
          _where:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - perm_key:
                _eq: post_news
            - allowed:
                _eq: true
            - club_id:
                _ceq: club_id
    set:
      author_steam_id: x-hasura-user-id
    columns:
    - channel_id
    - club_id
    - body
    - image_url
select_permissions:
- role: guest
  permission:
    columns:
    - id
    - channel_id
    - club_id
    - author_steam_id
    - body
    - image_url
    - created_at
    - deleted_at
    filter: {}
update_permissions:
- role: user
  permission:
    columns:
    - deleted_at
    - body
    filter:
      _or:
      - club:
          members:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - _or:
              - level:
                  _gte: 7
              - role:
                  _in:
                  - owner
                  - co_owner
                  - admin
      - _exists:
          _table:
            name: club_member_perm_overrides
            schema: public
          _where:
            _and:
            - steam_id:
                _eq: X-Hasura-User-Id
            - perm_key:
                _eq: moderate_news
            - allowed:
                _eq: true
            - club_id:
                _ceq: club_id
    check: {}
