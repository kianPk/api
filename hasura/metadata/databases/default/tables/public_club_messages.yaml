table:
  name: club_messages
  schema: public
object_relationships:
- name: channel
  using:
    foreign_key_constraint_on: channel_id
- name: club
  using:
    foreign_key_constraint_on: club_id
- name: author
  using:
    foreign_key_constraint_on: author_steam_id
insert_permissions:
- role: user
  permission:
    check:
      club:
        members:
          _and:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _in:
              - owner
              - admin
    set:
      author_steam_id: x-hasura-user-id
    columns:
    - channel_id
    - club_id
    - body
    - image_url
select_permissions:
- role: guest
  permission:
    columns:
    - id
    - channel_id
    - club_id
    - author_steam_id
    - body
    - image_url
    - created_at
    - deleted_at
    filter: {}
update_permissions:
- role: user
  permission:
    columns:
    - deleted_at
    - body
    filter:
      club:
        members:
          _and:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _in:
              - owner
              - admin
              - moderator
    check: {}
