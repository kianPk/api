table:
  name: player_duel_requests
  schema: public
object_relationships:
  - name: from_player
    using:
      foreign_key_constraint_on: from_steam_id
  - name: to_player
    using:
      foreign_key_constraint_on: to_steam_id
  - name: map
    using:
      foreign_key_constraint_on: map_id
  - name: match
    using:
      foreign_key_constraint_on: match_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - from_steam_id
        - to_steam_id
        - status
        - best_of
        - map_id
        - proposed_scheduled_at
        - match_id
        - expires_at
        - canceled_late
        - canceled_by_steam_id
        - wager_ypoints
        - wager_rake_percent
        - wager_status
        - wager_winner_steam_id
        - wager_settled_at
        - created_at
        - responded_at
      filter:
        _or:
          - from_steam_id:
              _eq: X-Hasura-User-Id
          - to_steam_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: true
    comment: ""
