table:
  name: club_challenge_progress
  schema: public
object_relationships:
- name: challenge
  using:
    foreign_key_constraint_on: challenge_id
- name: player
  using:
    foreign_key_constraint_on: steam_id
select_permissions:
- role: user
  permission:
    columns:
    - challenge_id
    - steam_id
    - progress
    - completed_at
    - updated_at
    filter:
      _or:
      - steam_id:
          _eq: X-Hasura-User-Id
      - challenge:
          club:
            owner_steam_id:
              _eq: X-Hasura-User-Id
- role: administrator
  permission:
    columns:
    - challenge_id
    - steam_id
    - progress
    - completed_at
    - updated_at
    filter: {}
